<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        /* - Element Selector :  */
        h2{
            color: blue;
        }
        /* - class Selector */
        .class1{
            color: chartreuse;
        } 
        
        /* - Id Selector */
        #id1{
            color: brown;
        }

        p{
            color: aqua;
        }
    </style>

</head>
<body>
    <h2>Element Selector</h2>
    <h2 class="class1">Class Selector</h2>
    <h2 id="id1">Id Selector</h2>


    <h3 class="class1">H3 Tag</h3>
    <p class="class1">Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolor qui in voluptates similique minus, molestias culpa quasi repellat dignissimos deleniti ut magni quia unde. Blanditiis dolores sequi quas adipisci incidunt?</p>
    
    <h2>H3 Tag</h2>
    


</body>
</html>
