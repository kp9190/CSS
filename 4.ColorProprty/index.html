<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* HexaDecimal */
        /* rang:0-9 a-f */
        #header1{
            color: #ffff00;
        }
        
        /* RGB Color */
        /* - rgb(rad,blue,green) 
           - rgb 0-255
           - rgb(255,255,255)
        */
        .className{
            color:rgb(100, 100, 100);
        }

        /* RGBA Color */
        /* - rgb(rad,blue,green) 
           - rgb 0-255         0-1(opecity)
           - rgba(255,255,255,0.5)
        */

        .className{
            color: rgba(255, 0, 255, 0.5);
        }
        
        /* HSL Color 
            hsl(hue,saturate,lightness)
            hsl(0-360,0%-100%,0%-100%)
            hsl(0,100%,50%)
         */
        h1{
            color: hsl(300, 50%, 27%);
         }

           /* HSLA Color 
            hsl(hue,saturate,lightness)
            hsl(0-360,0%-100%,0%-100%)   0-1(opecity)
            hsl(0,100%,50%)
         */
        h1{
            color: hsla(58, 100%, 50%, 0.5);
         }

    </style>
</head>
<body>
    <!-- h2#header1 -->
    <h2 id="header1">CSS1</h2>

    <!-- h2.className -->
    <!-- h2.className{CSS} -->
    <h2 class="className">CSS2</h2>

    <h1>Heading</h1>
</body>
</html>
