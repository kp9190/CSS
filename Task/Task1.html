<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Selectors Practice</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 id="main-title">Welcome to CSS Practice</h1>

  <p>This paragraph is for <b>element selector</b> practice.</p>

  <p class="highlight">This paragraph is for <b>class selector</b> practice.</p>

  <h2 class="highlight">This heading also uses the same class.</h2>

  <div>
    <h3 id="special-heading">This heading is for ID selector practice.</h3>
    <p>Inside a div — we’ll use this later for more advanced selectors!</p>
  </div>

</body>
</html>
